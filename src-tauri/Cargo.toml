[package]
name = "x-spider"
version = "26.1.0"
description = "A spider for X (Twitter)"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-all", "fs-all", "path-all", "os-all", "clipboard-all", "app-all", "dialog-all", "window-all", "notification-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "gzip", "rustls-tls", "blocking"] }
# CDP (DevTools Protocol)：通过 WebSocket 从 WebView2 进程内读取 HttpOnly Cookie，绕开文件锁
tungstenite = "0.21"
winreg = "0.52"
url = "2.5"
# 内置浏览器自动登录：读取并解密 WebView2 Cookie 所需
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
cipher = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
